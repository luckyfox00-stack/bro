<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С Днём Рождения! 🎉</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 20px;
            padding: 30px 20px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        h1 { color: #e94560; font-size: 1.8em; margin-bottom: 20px; }
        
        .video-box {
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            border: 3px solid #0f3460;
            margin-bottom: 25px;
            background: #000;
        }

        .btn {
            background: #e94560;
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
            width: 100%;
        }
        .btn:hover { transform: scale(1.05); background: #ff2e63; }

        .congrats { display: none; animation: fadeIn 1s; }
        @keyframes fadeIn { from {opacity: 0; transform: translateY(20px);} to {opacity: 1; transform: translateY(0);} }

        .certificate {
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
            border: 3px solid #e94560;
            border-radius: 15px;
            padding: 25px 15px;
            margin-top: 20px;
        }
        .certificate h3 { color: #e94560; font-size: 1.4em; margin-bottom: 15px; }
        .certificate p { color: #ccc; font-size: 1em; line-height: 1.6; margin-bottom: 10px; }
        .stamp {
            display: inline-block;
            background: #e94560;
            color: #fff;
            padding: 8px 20px;
            border-radius: 5px;
            font-size: 1em;
            margin-top: 15px;
            transform: rotate(-3deg);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ЭКРАН 1: Видео и кнопка -->
        <div id="screen1">
            <h1>Специально для тебя! 🎁</h1>
            
            <div class="video-box">
                <!-- 👇 ВСТАВЬ СЮДА НОМЕР ВИДЕО ИЗ TIKTOK 👇 -->
                <iframe 
                    src="https://www.tiktok.com/embed/7611663377177267469" 
                    width="100%" 
                    height="550" 
                    frameborder="0" 
                    allowfullscreen>
                </iframe>
            </div>

            <button class="btn" onclick="showCongrats()">🎉 Получить поздравление</button>
        </div>

        <!-- ЭКРАН 2: Поздравление -->
        <div class="congrats" id="screen2">
            <h1>С Днём Рождения! 🥳</h1>
            <p style="color: #ccc; margin-bottom: 20px;">Брат, желаю тебе крутых моментов, лёгких решений и чтобы всё задуманное сбывалось!</p>
            
            <div class="certificate">
                <h3>🏆 СЕРТИФИКАТ</h3>
                <p>Настоящим подтверждается, что ты —</p>
                <p style="color: #fff; font-size: 1.2em; font-weight: bold; margin: 15px 0;">ЛУЧШИЙ ДВОЮРОДНЫЙ БРАТ</p>
                <p>Спасибо, что ты есть. Расти, развивайся и будь счастлив!</p>
                <div class="stamp">ОДОБРЕНО СЕМЬЁЙ</div>
            </div>
        </div>
    </div>

    <script>
        function showCongrats() {
            document.getElementById('screen1').style.display = 'none';
            document.getElementById('screen2').style.display = 'block';
        }
    </script>
</body>
</html>
